# The benchmarks (design/ci.md §5): those of the change and those of its
# base, measured in the same job, on the same machine, compared in the
# summary of the run. Informative: a shared runner is noisy, the job never
# fails on a slower benchmark. The results of main are kept as artifacts,
# for the trend. Up to 45 minutes: on main when code changes, on a pull
# request only with the label `benchmark`.
name: Benchmarks

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'design/**'
      - 'refinement/**'
      - 'apps/docs/**'
      - 'apps/editor/**'
      - 'apps/editor-web/**'
      - '.github/workflows/docs.yml'
      - '.github/workflows/addons.yml'
  workflow_dispatch:

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24

jobs:
  bench:
    name: Benchmarks
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'benchmark')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          lfs: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # The base: the target of the pull request, or the previous commit of
      # main.
      - name: Base
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          base=${BASE:-$(git rev-parse HEAD~1)}
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git rev-parse HEAD~1)
          fi
          echo "Base: $base"
          git worktree add "$RUNNER_TEMP/base" "$base"
          (cd "$RUNNER_TEMP/base" && npm ci)

      # The base first, then the change, with the tools of the change.
      - name: Measure
        run: |
          node tools/bench/run.mjs "$RUNNER_TEMP/bench-base.json" --root "$RUNNER_TEMP/base"
          node tools/bench/run.mjs bench.json

      - name: Compare
        run: |
          node tools/bench/compare.mjs "$RUNNER_TEMP/bench-base.json" bench.json >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the results of main
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-${{ github.sha }}
          path: bench.json
          retention-days: 90
