# The checks of every pull request and of main (design/ci.md §3): the
# format, typecheck, lint and tests of the projects affected by the change
# (`check`), then the native addons and the rendering suite on software GPUs
# (`native`): Vulkan on lavapipe, Dawn, HLSL through DXC, WebGL2 in
# Chromium with SwiftShader; the same under Windows (`windows`, design/
# p11-windows.md §2), with Direct3D 12 on WARP.
#
# The cache of Nx is restored from the last run of main, and saved by main
# only (nx.json caps it with maxCacheSize): a pull request reads it, never
# adds an entry of its own to the 10 GB of the repository.
#
# The third-party actions are pinned by commit, their version beside.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A new run on the same branch cancels the previous one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # nx affected compares with the base of the change.
          fetch-depth: 0
          lfs: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # NX_BASE and NX_HEAD: the last successful run on main, or the base of
      # the pull request.
      - uses: nrwl/nx-set-shas@3e9ad7370203c1e93d109be57f3b72eb0eb511b1 # v4.4.0

      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .nx/cache
          key: nx-check-${{ runner.os }}-main-${{ github.sha }}
          restore-keys: nx-check-${{ runner.os }}-main-

      - name: Format
        run: npm run format:check

      - name: Typecheck and lint
        run: npx nx affected -t typecheck lint

      # The projects tagged gpu (the native addons, the rendering suite) run
      # in the native job.
      - name: Tests
        run: npx nx affected -t test --exclude=tag:gpu

      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: .nx/cache
          key: nx-check-${{ runner.os }}-main-${{ github.sha }}

  native:
    name: Native and rendering
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # A suite that cannot run fails instead of being skipped.
      FDW_REQUIRE_SUITES: vulkan,dawn,hlsl,glsl,window,native
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          lfs: true

      # The version of the SDK the prebuilt addons are built with.
      - name: Vulkan SDK version
        run: echo "VULKAN_SDK_VERSION=$(cat tools/native/VULKAN_SDK_VERSION)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - uses: nrwl/nx-set-shas@3e9ad7370203c1e93d109be57f3b72eb0eb511b1 # v4.4.0

      # The affected projects tagged gpu: the rest of the job only runs when
      # there are some.
      - name: Affected GPU projects
        id: affected
        run: |
          projects=$(npx nx show projects --affected --projects 'tag:gpu' --json | jq -r 'join(",")')
          echo "projects=$projects" >> "$GITHUB_OUTPUT"
          echo "Affected: ${projects:-none}"

      # lavapipe (the software Vulkan of Mesa) and the Vulkan loader; Xvfb
      # for the windows; the headers SDL builds its X11 video with; ccache.
      - name: System packages
        if: steps.affected.outputs.projects != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers libvulkan1 xvfb ccache \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxss-dev libxtst-dev libxkbcommon-dev libdrm-dev \
            libgbm-dev libegl1-mesa-dev libgl1-mesa-dev libwayland-dev \
            libdecor-0-dev libudev-dev

      # DXC, spirv-val, spirv-cross and the validation layers.
      - name: Vulkan SDK (cache)
        if: steps.affected.outputs.projects != ''
        id: vulkan-sdk
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/vulkan/${{ env.VULKAN_SDK_VERSION }}
          key: vulkan-sdk-${{ runner.os }}-${{ env.VULKAN_SDK_VERSION }}

      - name: Vulkan SDK (download)
        if: steps.affected.outputs.projects != '' && steps.vulkan-sdk.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/vulkan
          base=https://sdk.lunarg.com/sdk/download/$VULKAN_SDK_VERSION/linux
          curl -fsSL -o /tmp/vulkan-sdk.tar.xz \
            "$base/vulkansdk-linux-x86_64-$VULKAN_SDK_VERSION.tar.xz" ||
          curl -fsSL -o /tmp/vulkan-sdk.tar.xz "$base/vulkan_sdk.tar.xz"
          tar -xJf /tmp/vulkan-sdk.tar.xz -C ~/vulkan

      # The variables of setup-env.sh, for the next steps.
      - name: Vulkan SDK (environment)
        if: steps.affected.outputs.projects != ''
        run: |
          source ~/vulkan/$VULKAN_SDK_VERSION/setup-env.sh
          {
            echo "VULKAN_SDK=$VULKAN_SDK"
            echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"
            echo "VK_ADD_LAYER_PATH=$VK_ADD_LAYER_PATH"
          } >> "$GITHUB_ENV"
          echo "$VULKAN_SDK/bin" >> "$GITHUB_PATH"

      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: steps.affected.outputs.projects != ''
        with:
          path: .nx/cache
          key: nx-native-${{ runner.os }}-main-${{ github.sha }}
          restore-keys: nx-native-${{ runner.os }}-main-

      # The CMake builds of the addons (SDL and the other fetched
      # dependencies), and the compiler cache.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: steps.affected.outputs.projects != ''
        with:
          path: |
            packages/engine-native/build
            packages/engine-vulkan/build
            ~/.cache/ccache
          key: native-build-${{ runner.os }}-${{ env.VULKAN_SDK_VERSION }}-${{ hashFiles('packages/*/native/**', 'tools/native/**') }}
          restore-keys: native-build-${{ runner.os }}-${{ env.VULKAN_SDK_VERSION }}-

      - name: Chromium (cache)
        if: steps.affected.outputs.projects != ''
        id: playwright
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # The system libraries of Chromium (apt, not cached), then Chromium
      # itself when the cache has none.
      - name: Chromium (system libraries)
        if: steps.affected.outputs.projects != ''
        run: npx playwright install-deps chromium

      - name: Chromium
        if: steps.affected.outputs.projects != '' && steps.playwright.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      # In a virtual display, for the windows. One project at a time: each
      # drives software GPUs that spread on the 4 vCPU of the runner.
      - name: Tests
        if: steps.affected.outputs.projects != ''
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          PROJECTS: ${{ steps.affected.outputs.projects }}
        run: xvfb-run -a npx nx run-many -t test --projects="$PROJECTS" --parallel=1

      # The durations of the tests (JUnit, where a project writes it), to
      # follow them rather than lengthen the timeouts.
      - name: Durations of the tests
        if: always() && steps.affected.outputs.projects != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-${{ runner.os }}
          path: |
            tests/*/test-output/junit.xml
            packages/*/test-output/junit.xml
            apps/*/test-output/junit.xml
          if-no-files-found: ignore
          retention-days: 30

      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: steps.affected.outputs.projects != '' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: .nx/cache
          key: nx-native-${{ runner.os }}-main-${{ github.sha }}

  # The native job under Windows: the addons built by MSVC, Vulkan on
  # lavapipe, Direct3D 12 and Dawn on WARP, Chromium with WARP and
  # SwiftShader. The windows open on the desktop of the runner. No compiler
  # cache: the Visual Studio generator of CMake takes no launcher (sccache
  # would need Ninja); MSBuild rebuilds only what changed in the cached
  # build directories.
  windows:
    name: Windows
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      FDW_REQUIRE_SUITES: vulkan,d3d12,dawn,hlsl,glsl,window,native
      # The software rasterizer of Windows: the runner has no GPU.
      FDW_D3D12_ADAPTER: warp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          lfs: true

      - name: Vulkan SDK version
        run: echo "VULKAN_SDK_VERSION=$(cat tools/native/VULKAN_SDK_VERSION)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - uses: nrwl/nx-set-shas@3e9ad7370203c1e93d109be57f3b72eb0eb511b1 # v4.4.0

      # The affected projects tagged gpu, but the desktop editor: its tests
      # under Windows come with its viewport (design/p11-windows.md §6).
      - name: Affected GPU projects
        id: affected
        run: |
          projects=$(npx nx show projects --affected --projects 'tag:gpu' --exclude editor --json | jq -r 'join(",")')
          echo "projects=$projects" >> "$GITHUB_OUTPUT"
          echo "Affected: ${projects:-none}"

      # The SDK (DXC, spirv-val, spirv-cross, glslangValidator), the Vulkan
      # loader (the runner has no GPU driver to bring it) and lavapipe. volk
      # and VMA are optional components of the Windows installer. Not cached:
      # the key of the action ignores the components, and its cache would
      # bring back an SDK without them.
      - name: Vulkan SDK, loader and lavapipe
        if: steps.affected.outputs.projects != ''
        uses: jakoch/install-vulkan-sdk-action@d17de7e2f5e50efb5d2123efed18497d3c58c533 # v1.7.0
        with:
          vulkan_version: ${{ env.VULKAN_SDK_VERSION }}
          optional_components: com.lunarg.vulkan.volk,com.lunarg.vulkan.vma
          install_runtime: true
          install_lavapipe: true
          lavapipe_destination: C:\Lavapipe

      # lavapipe as the only Vulkan driver.
      - name: lavapipe
        if: steps.affected.outputs.projects != ''
        run: |
          manifest=$(find /c/Lavapipe -name 'lvp_icd*.json' 2>/dev/null | head -n 1)
          if [ -z "$manifest" ]; then
            echo "No lavapipe manifest found under C:\\Lavapipe" >&2
            ls -R /c/Lavapipe >&2 || true
            exit 1
          fi
          echo "lavapipe: $manifest"
          echo "VK_DRIVER_FILES=$(cygpath -w "$manifest")" >> "$GITHUB_ENV"
          echo "$VULKAN_SDK/Bin" >> "$GITHUB_PATH"

      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: steps.affected.outputs.projects != ''
        with:
          path: .nx/cache
          key: nx-native-${{ runner.os }}-main-${{ github.sha }}
          restore-keys: nx-native-${{ runner.os }}-main-

      # The CMake builds of the addons (SDL and the other fetched
      # dependencies): MSBuild rebuilds what changed.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: steps.affected.outputs.projects != ''
        with:
          path: |
            packages/engine-native/build
            packages/engine-vulkan/build
            packages/engine-d3d12/build
          key: native-build-${{ runner.os }}-${{ env.VULKAN_SDK_VERSION }}-${{ hashFiles('packages/*/native/**', 'tools/native/**') }}
          restore-keys: native-build-${{ runner.os }}-${{ env.VULKAN_SDK_VERSION }}-

      - name: Chromium (cache)
        if: steps.affected.outputs.projects != ''
        id: playwright
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/AppData/Local/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # Chromium and its headless shell: WebGPU needs the first under
      # Windows (apps/editor-web/vite.config.mts).
      - name: Chromium
        if: steps.affected.outputs.projects != '' && steps.playwright.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Tests
        if: steps.affected.outputs.projects != ''
        env:
          PROJECTS: ${{ steps.affected.outputs.projects }}
        run: npx nx run-many -t test --projects="$PROJECTS" --parallel=1

      - name: Durations of the tests
        if: always() && steps.affected.outputs.projects != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-${{ runner.os }}
          path: |
            tests/*/test-output/junit.xml
            packages/*/test-output/junit.xml
            apps/*/test-output/junit.xml
          if-no-files-found: ignore
          retention-days: 30

      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: steps.affected.outputs.projects != '' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: .nx/cache
          key: nx-native-${{ runner.os }}-main-${{ github.sha }}
