# The documentation (design/ci.md §4): built and its links checked on every
# pull request, published on GitHub Pages from main.
name: Documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24

jobs:
  build:
    name: Build the documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-docs-${{ runner.os }}-${{ github.sha }}
          restore-keys: nx-docs-${{ runner.os }}-

      - name: Build
        run: npx nx run docs:build

      - name: Links
        run: node tools/docs/check-links.mjs apps/docs/dist

      - name: Upload the site
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/docs/dist

  deploy:
    name: Publish
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
